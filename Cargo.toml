[package]
name = "qwen38-metal"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A native Rust and Metal runtime substrate for Qwen3.8 long-context inference."
license = "GPL-3.0-only"
repository = "https://github.com/Fuxx-1/qwen38-metal"
build = "build.rs"

[[bin]]
name = "qwen38-metal"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.221", features = ["derive"] }
serde_json = "=1.0.140"
axum = "=0.8.9"
base64 = "=0.22.1"
futures-util = "=0.3.31"
image = { version = "=0.25.5", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"] }
memmap2 = "=0.9.9"
metal = "=0.33.0"
reqwest = { version = "=0.12.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream"] }
tokenizers = { version = "=0.22.1", default-features = false, features = ["fancy-regex"] }
subtle = "=2.6.1"
tokio = { version = "=1.48.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tower = { version = "=0.5.2", features = ["util"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
